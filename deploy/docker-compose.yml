services:
  server:
    image: ghcr.io/simchming/autonotice-server:latest
    container_name: autonotice-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - "./data:/app/data"
      # 管理员 Shell：通过 docker.sock 管理整个 Autonotice/NapCat 栈
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/opt/autonotice:/opt/autonotice"
      # NapCat WebUI token（只读），用于后台「运维」页一键登录
      - "./napcat/config/webui.json:/app/napcat-webui.json:ro"
    depends_on:
      - napcat
    mem_limit: 512m

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: autonotice-napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=3754609823
    ports:
      - "6099:6099"
    volumes:
      - "./napcat:/app/napcat"
      - "./napcat/config:/app/napcat/config"
      - "./napcat/qq:/app/.config/QQ"
    mem_limit: 768m
