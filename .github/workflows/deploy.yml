name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/simchming/autonotice-server:latest
            ghcr.io/simchming/autonotice-server:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步 compose 与运维脚本
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/deploy.sh"
          target: "/opt/autonotice"
          strip_components: 1
          overwrite: true

      - name: 拉取构建产物（runner 侧）
        run: docker pull ghcr.io/simchming/autonotice-server:v${{ github.run_number }}

      - name: 传输镜像并重启
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          IMAGE="ghcr.io/simchming/autonotice-server:v${{ github.run_number }}"
          docker save "$IMAGE" | gzip -1 | ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            "root@${{ secrets.SERVER_HOST }}" \
            "gunzip | docker load && docker tag '$IMAGE' ghcr.io/simchming/autonotice-server:latest && cd /opt/autonotice && bash deploy.sh"
